# =============================================================================
# TEMPLATE — KHÔNG dùng file này trực tiếp cho Alertmanager.
# Alertmanager tự đọc file config của chính nó, KHÔNG chạy qua docker-compose
# interpolation — cú pháp "${VAR:-default}" kiểu compose sẽ KHÔNG được thay thế
# và làm Alertmanager crash-loop khi parse config (đã xảy ra thật, xem lịch sử).
#
# File này được service "alertmanager-config" (xem docker-compose.yml) render
# bằng envsubst -> ghi ra volume dùng chung -> Alertmanager đọc bản đã render.
# Biến dùng cú pháp envsubst thuần "${VAR}" (KHÔNG default trong file này —
# giá trị mặc định đặt ở "environment:" của service alertmanager-config trong
# docker-compose.yml, để ops/monitoring/.env chỉ cần set giá trị thật).
# =============================================================================
global:
  # Thời gian chờ resolve nếu không nhận được thêm alert
  resolve_timeout: 5m
  # SMTP — điền giá trị thật qua ops/monitoring/.env (xem .env.example)
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: ${SMTP_REQUIRE_TLS}

# Templates tùy chỉnh
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ---------------------------------------------------------------------------
# Route — phân loại và định tuyến alert
# ---------------------------------------------------------------------------
route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-slack

  routes:
    # Lỗi 5xx tăng cao — gửi email ngay cho ops, VẪN tiếp tục xét route critical bên dưới
    - match:
        alertname: HTTP5xxRateHigh
      receiver: ops-email
      group_wait: 10s
      repeat_interval: 30m
      continue: true

    # P1 Critical — notify ngay lập tức, không giảm tần suất
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Database down → alert riêng
    - match:
        alertname: MySQLDown
      receiver: db-alert
      group_wait: 10s
      repeat_interval: 30m

    # Security alerts
    - match:
        category: security
      receiver: security-team
      group_wait: 0s
      repeat_interval: 2h

    # Disk space warning
    - match:
        alertname: DiskSpaceHigh
      receiver: ops-email
      repeat_interval: 6h

# ---------------------------------------------------------------------------
# Inhibition rules — tránh alert cascade
# ---------------------------------------------------------------------------
inhibit_rules:
  # Nếu service down thì inhibit các alert khác của service đó
  - source_match:
      alertname: ServiceDown
    target_match_re:
      alertname: "High.*|.*Error.*|.*Latency.*"
    equal: ["service"]

  # Nếu MySQL down thì inhibit slow query alerts
  - source_match:
      alertname: MySQLDown
    target_match:
      alertname: MySQLSlowQuery
    equal: []

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:
  # Slack channel chính (#ops-alerts)
  - name: default-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#ops-alerts"
        username: "ProDiab AlertManager"
        icon_emoji: ":rotating_light:"
        send_resolved: true
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }} :fire:{{ else }} :white_check_mark:{{ end }}] {{ .GroupLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt | since }}
          {{ end }}

  # PagerDuty cho critical P1
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_INTEGRATION_KEY}"
        description: "{{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}"
        severity: critical
        client: "ProDiab AlertManager"
        details:
          firing: "{{ .Alerts.Firing | len }}"
          service: "{{ .GroupLabels.service }}"

  # Slack + Email riêng cho database
  - name: db-alert
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#ops-database"
        username: "ProDiab DB Alert"
        icon_emoji: ":database:"
        send_resolved: true
        title: "[DB ALERT] {{ .GroupLabels.alertname }}"
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: "${OPS_ALERT_EMAIL}"
        send_resolved: true
        headers:
          Subject: "[Pro-Diab HIS] Canh bao co so du lieu: {{ .GroupLabels.alertname }}"
        html: |
          <h3>Cảnh báo Pro-Diab HIS — Cơ sở dữ liệu</h3>
          {{ range .Alerts }}
          <p>
            <b>Dịch vụ:</b> {{ .Labels.service }}<br/>
            <b>Mức độ:</b> {{ .Labels.severity }}<br/>
            <b>Nội dung:</b> {{ .Annotations.summary }}<br/>
            <b>Chi tiết:</b> {{ .Annotations.description }}<br/>
            <b>Thời điểm:</b> {{ .StartsAt }}<br/>
          </p>
          {{ end }}
          <p><a href="${GRAFANA_URL}">Xem chi tiết trên Grafana</a></p>

  # Security team
  - name: security-team
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_SECURITY}"
        channel: "#security-alerts"
        username: "ProDiab Security"
        icon_emoji: ":lock:"
        send_resolved: false
        title: ":rotating_light: SECURITY ALERT: {{ .GroupLabels.alertname }}"
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  # Ops email — cảnh báo 5xx cao, disk, và các cảnh báo vận hành chung
  - name: ops-email
    email_configs:
      - to: "${OPS_ALERT_EMAIL}"
        send_resolved: true
        headers:
          Subject: "[Pro-Diab HIS] {{ if eq .Status \"firing\" }}CANH BAO{{ else }}DA KHAC PHUC{{ end }}: {{ .GroupLabels.alertname }}"
        html: |
          <h3>{{ if eq .Status "firing" }}⚠️ Cảnh báo đang xảy ra{{ else }}✅ Cảnh báo đã hết{{ end }} — Pro-Diab HIS</h3>
          {{ range .Alerts }}
          <p>
            <b>Dịch vụ:</b> {{ .Labels.service }}<br/>
            <b>Mức độ (severity):</b> {{ .Labels.severity }}<br/>
            <b>Nội dung:</b> {{ .Annotations.summary }}<br/>
            <b>Chi tiết:</b> {{ .Annotations.description }}<br/>
            <b>Thời điểm bắt đầu:</b> {{ .StartsAt }}<br/>
          </p>
          {{ end }}
          <p>Xem log và biểu đồ chi tiết tại Grafana: <a href="${GRAFANA_URL}">${GRAFANA_URL}</a></p>
          <p style="color:#888;font-size:12px">Email tự động từ Alertmanager — Pro-Diab HIS. Không trả lời email này.</p>

# ---------------------------------------------------------------------------
# Alert rules — định nghĩa các ngưỡng cảnh báo
# Rule THẬT chạy qua Loki ruler, đặt tại ops/monitoring/loki-rules/fake/*.yaml
# (Loki tự gửi alert sang Alertmanager theo "ruler.alertmanager_url" cấu hình
# trong ops/monitoring/loki-config.yml — KHÔNG cấu hình alert rule ở file này).
# ---------------------------------------------------------------------------
# Đã có rule LogQL thật (xem ops/monitoring/loki-rules/fake/prodiab-alerts.yaml):
#
# 1. HTTP5xxRateHigh — ĐÃ TẠO, route sang "ops-email" (xem route ở trên)
#    condition: tỷ lệ log 5xx / tổng log request backend > 1% trong 5 phút
#    severity: critical
#
# Các alert sau CHƯA có rule LogQL thật (mô tả để làm sau, ngoài scope task này):
#
# 2. APILatencyHigh
#    condition: p95 latency > 1000ms trong 5 phút
#    severity: warning
#
# 3. MySQLDown
#    condition: không nhận được log từ MySQL trong 5 phút
#    severity: critical
#
# 4. DiskSpaceHigh
#    condition: disk usage > 80%
#    severity: warning; > 90% → critical
#
# 5. BackupFailed
#    condition: không có backup file mới hơn 25 giờ
#    severity: critical
#
# 6. ContainerDown
#    condition: container prodiab_backend/frontend/nginx restart > 3 lần/giờ
#    severity: warning
